<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Вылеты из Берлина (BER)</title>
</head>
<body>
  <h1>Вылеты из Берлина (BER)</h1>
  <form method="get" action="/FlightServlet">
    <label for="destination">Город латиницей или код IATA</label>
    <input type="text" id="destination" name="destination" placeholder="Amsterdam или AMS">
    <label for="period">Период по времени Берлина</label>
    <select id="period" name="period">
      <option value="">Текущий</option>
      <option value="0">00:00–06:00</option>
      <option value="6">06:00–12:00</option>
      <option value="12">12:00–18:00</option>
      <option value="18">18:00–24:00</option>
    </select>
    <button type="submit">Показать рейсы</button>
  </form>
  <p>Оставьте поле города пустым, чтобы увидеть все рейсы за выбранный период.</p>
</body>
</html>
